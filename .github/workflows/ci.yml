name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Package build
        run: python -m build
      - name: Import and readiness smoke test
        env:
          DESIGN_FLOW_PROJECT_ROOT: ${{ runner.temp }}/design-flow-projects
        run: python -c "from design_flow_mcp.server import adapter, mcp; assert adapter.readiness()['engine_version'] == '0.2.0'; print(type(mcp).__name__)"

